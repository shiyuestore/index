<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡結帳頁面 - 三什兩克</title>
    <style>
        body {
            font-family: "serif", "Noto Serif TC", sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .checkout-container {
            max-width: 450px;
            width: 100%;
        }
        .section-title {
            font-size: 16px;
            letter-spacing: 1px;
            margin: 30px 0 15px 0;
            text-transform: uppercase;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 8px;
        }
        .order-summary {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px 0;
        }
        .product-thumb {
            width: 80px;
            height: 80px;
            background-color: #f7f7f7;
            object-fit: contain;
        }
        .product-info {
            flex-grow: 1;
        }
        .product-name {
            font-size: 15px;
            margin: 0 0 5px 0;
        }
        .product-price {
            font-size: 14px;
            font-weight: bold;
        }
        .option-group {
            margin-bottom: 15px;
        }
        .option-label {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid #e5e5e5;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .option-label input {
            margin-right: 12px;
        }
        .option-label:hover {
            border-color: #1a1a1a;
        }
        .total-box {
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #1a1a1a;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .grand-total {
            font-size: 16px;
            font-weight: bold;
        }
        .btn-submit {
            width: 100%;
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            padding: 15px;
            font-size: 14px;
            letter-spacing: 1px;
            margin-top: 25px;
            cursor: pointer;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="checkout-container">
    <!-- 商品摘要區 -->
    <div class="section-title">商品摘要</div>
    <div class="order-summary">
        <!-- 這裡已經幫您精確換成您的商品照片檔名了 -->
        <img class="product-thumb" src="Polish_20260923_151622580~2.jpg" alt="Product">
        <div class="product-info">
            <h3 class="product-name">Rain of temple (線香)</h3>
            <span class="product-price">$18.00 (約 NT$540)</span>
        </div>
    </div>

    <!-- 運送方式區 -->
    <div class="section-title">運送方式</div>
    <div class="option-group">
        <label class="option-label">
            <input type="radio" name="shipping" value="cvs" checked onclick="updateTotal(60)">
            7-ELEVEN / 全家 超商取貨 (運費 NT$60)
        </label>
    </div>
    <div style="font-size: 12px; color: #666; padding-left: 12px; margin-top: -5px;">
        ※ 點擊下方按鈕下單後，將會引導您填寫取貨超商門市。
    </div>

    <!-- 付款方式區 -->
    <div class="section-title">付款方式</div>
    <div class="option-group">
        <label class="option-label">
            <input type="radio" name="payment" value="bank" checked>
            本地銀行轉帳 / ATM 簡單匯款 (免手續費)
        </label>
    </div>

    <!-- 費用明細區 -->
    <div class="total-box">
        <div class="total-row">
            <span>商品小計</span>
            <span>NT$ 540</span>
        </div>
        <div class="total-row">
            <span>超商運費</span>
            <span id="shipping-fee">NT$ 60</span>
        </div>
        <div class="total-row grand-total" style="margin-top: 10px;">
            <span>下單應付總計</span>
            <span id="grand-total">NT$ 600</span>
        </div>
    </div>

    <!-- 提交按鈕：點擊後會連動到 Google 表單 -->
    <button class="btn-submit" onclick="location.href='
                https://google.com
